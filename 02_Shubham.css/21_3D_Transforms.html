<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transforms</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100%;
            
        }

        .container{
            
            background-color: antiquewhite;
            padding: 5rem;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 1rem;

        }

        .item{
            padding: 2rem;
            height: 250px;
            width: 250px;
            background-color: rgb(72, 117, 62);
            border: 2px solid black
            ;
        }
        #rotateX:hover{
            transform: rotateX(45deg); /*X asix ke about rotate hoga*/
        }
        #rotateY:hover{
            transform: rotateY(45deg); /*Y asix ke about rotate hoga*/
        }
        #rotateZ:hover{
            transform: rotateZ(45deg);
        }

        #translateX:hover{
            transform: translateX(100px);
        }
        #translateY:hover{
            transform: translateY(100px);
        }
        #translateZ:hover{
            /*Perspective 3000px add karna hoga tabhi
            dikhega .... z axis mai hai na isiliye
            perspective 200px matlab 200px door se
            dekh raha hu*/
            transform: perspective(200px) translateZ(100px);
        }


        #scaleX:hover{
            transform: scaleX(1.5);
        }
        /* #scaleY:hover{
            transform: skewY(35deg);
        } */
        #scaleY:hover{
            transform: scaleY(5);
        }
        #scaleZ:hover{
            /*rotate add kel tr scale pn hoil*/
            transform: perspective(200px) scaleZ(2) rotateY(30deg);
        }
   

    </style>
</head>
<body>

    <div class="container">

        <div class="item" id="rotateX">RotateX</div>
        <div class="item" id="rotateY">RotateY</div>
        <div class="item" id="rotateZ">RotateZ</div>
        <div class="item" id="translateX">TranslateX</div>
        <div class="item" id="translateY">TranslateY</div>
        <div class="item" id="translateZ">TranslateZ</div>
        <div class="item" id="scaleX">ScaleX</div>
        <div class="item" id="scaleY">ScaleY</div>
        <div class="item" id="scaleZ">ScaleZ</div>
        


    
</body>
</html>
