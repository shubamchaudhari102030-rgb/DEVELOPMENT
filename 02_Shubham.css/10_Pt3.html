<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

 <style>

 .container{
    border: 2px black solid;
    background-color: bisque;
    display: flex;
    flex-direction: row;
    width: 450px;
    padding: 2px;
 }

 #leftbox{
    background-color:aquamarine;
    border: 1px solid red;
    width: 47%;
    margin: 3px;
    padding: 2px;
    flex-direction: column;
 }

#rightbox{
    background-color: coral;
    border: 1px solid blue;
    width: 47%;
    margin: 3px;
    padding: 2px;
}
p{
    border: 1px solid yellow;
}

img{
    width: 170px;
}

@media (max-width:640px){
    .container{
        flex-direction: column;
    }
}

 </style>
</head>
<body>

    <div class="container">

    <div id="leftbox">
        <p>Text1</p>
        <p>Text2</p>
    </div>

    <div id="rightbox">

    <img src="bgs.jpg" alt="">

    </div>

    </div>
    
</body>
</html>
