<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
/* flex is used to arrange and align elements inside a container */
.container{
    background-color: bisque;
    border: 5px solid brown;
    margin: 3px;
    height: 1000px;
    padding: 3px;
    display: flex;   /*by default flex chi dirn row set houn jail */
    flex-direction: row ;  /* 4 types*/

    
    

justify-content: center;/* this is used to 
align items along the main(Horizontal) axis */

 align-items: center; /* this is used to align items along the main(Vertical) axis */
 /* align-items: stretch; this is also works if height is not mentioned */

 align-content:start ; /*ye chipak chipak ke flex karega, without any gap */

}

.box{
    height: 200px;
    width: 200px;
    border: 3px solid black;
    margin: 3px;
    padding: 3px;
}

#box1{
    background-color: blue;
    flex-shrink: 5; /*because of this, 1st box 5 times more speed se 
    shrink hoga */

    flex-grow: 2;/* is se box 1 ki length
    increse ho gaii*/

    
}
#box2{
   background-color: aqua;
}
#box3{
   background-color: brown;
}
#box4{
    background-color: coral;


}




 </style>



</head>

<body>
    
 <div class="container">


<div class="box" id="box1"></div>
<div class="box" id="box2"></div>
<div class="box" id="box3"></div>
<div class="box" id="box4"></div>

 </div>


</body>
</html>



</body>
</html>
