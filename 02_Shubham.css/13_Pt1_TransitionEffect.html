<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <style>

 .box{
    background-color: beige;
    height: 400px;
    width: 400px;
    border: 2px solid black;

    /* transition-property: width; then sirf width ke upar hi trans. apply hoga */
    transition-property:all ;/* ab sab par trans. apply hoga */
    transition-duration: 2s;
    transition-delay: 1s;
    transition-timing-function: linear;

 }
 
 /* hover= ui pe box ke upar touch karne par
 ye andar wala effect apply hoga */
 .box:hover{
    width: 1200px;
    height: 900px;
    background-color: blue;
 }

 </style>


</head>
<body>

    <div class="box"></div>

    
</body>
</html>
