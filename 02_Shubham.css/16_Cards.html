<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    .container{
        width: 100vw;
        height: 100vh;
        background: #020024;
background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 0%, rgba(0, 201, 248, 1) 65%, rgba(0, 212, 255, 1) 69%, rgba(0, 212, 255, 1) 32%);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card{
        width: 360px;
        height: 600px;
        background-color: white;
        border-radius: 20px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;

        padding:20px ;

    }

    .card img{
        width: 315px;
        height: 60%;
        border-radius: 10px;

    }

    .card h2{
        font-weight: bold;
        font-size: 1.5rem;
    }

    .card p{
        font-size: 1.2em;
    }



    </style>

</head>
<body>

    <div class="container">
    
        <div class="card">
            <img src="bgs.jpg" alt="">

            <h2>Improve Your Front skills buy developing projects</h2>

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate, minima!
            </p>


        </div>

    </div>
    
</body>
</html>
