<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="18_Styles.css">

</head>
<body class="body_container">

    <div class="container">

        <header class="header_container" >
            <h1 class="header_title">CodeHelp Blogs</h1>
            <p class="header_desc">
                Utilize this space to incorporate a captivating subheading crafted by ChatGPT, adding depth and intrigue to your blog
            </p>

        </header>

        <main class="main_container">

            <!-- card 1 start -->
             <div class="card_container">
                <a href="#" class="card_image_container">
                    <img src="kanha.webp" alt="card 1 image"
                    class="card_image"
                    loading="lazy"> <!-- /*niche wali images scroll karne par hi load karte hai*/ -->

                </a>
                
                <div class="card_title_container">
                    <a href="#" class="class_title_anchor">
                        <h2 class="card_title">New Gadgets Released</h2>
                    </a>
                    <p class="card_desc">
                        Check out the latest tech gadgets hitting the market, from smartphones to smartwatches

                    </p>



                </div>

                <div class="class_footer_container">
                    <div class="author_container">
                        <div class="author_avtaar_container">
                            <img src="pw.jpeg" alt="avatar 1" width="100px"
                            loading="lazy"
                            class="author_avatar">
                        </div>
                        <div class="author_info_container">
                            <span class="author_name">
                                John Doe
                            </span>
                            <span class="author_date">
                                sept 19, 2021

                            </span>
                        </div>


                    </div>
                    <div class="card_tag_container">
                        <span>
                            Technology
                        </span>

                    </div>
                </div>

             </div>

            <!-- card 1 ends here -->

        </main>


    </div>
    
</body>
</html>
