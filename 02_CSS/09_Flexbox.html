<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

 <style>

/* flex is used to arrange and align elements inside a container */
.container{
    background-color: bisque;
    border: 5px solid brown;
    margin: 3px;
    height: 1000px;
    padding: 3px;
    display: flex;   /*by default flex chi dirn row set houn jail */
    flex-direction: row ;  /* 4 types*/

    flex-wrap: wrap;  /* ya nantar squiz kelya nantar pn squiz nahi honar */
    

justify-content:space-between;/* this is used to align items along the main(Horizontal) axis */
/*space between ne te equal place with equal gap ghetat*/   

 align-items: center; /*this is used to align items along the main(Vertical) axis
 /* align-items: stretch; this is also works if height is not mentioned */


       /* v imp note */
       /* if flex direction: row then above horizontal and vertical is true 
       if flex direction is column the upar ke notes reverse ho jayenge */



 align-content:start ; /*ye chipak chipak ke flex karega, without any gap */

}

.box{
    height: 200px;
    width: 200px;
    border: 3px solid black;
    margin: 3px;
    padding: 3px;
}

#box1{
    background-color: blue;
    
    
}
#box2{
   background-color: aqua;
}
#box3{
   background-color: brown;
}
#box4{
    background-color: coral;

}




 </style>


</head>
<body>
    
 <div class="container">


<div class="box" id="box1">box1</div>
<div class="box" id="box2">box2</div>
<div class="box" id="box3">box3</div>
<div class="box" id="box4">box4</div>

 </div>


</body>
</html>
